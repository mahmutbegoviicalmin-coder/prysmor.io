# Build Windows (.exe) + macOS (.pkg) Premiere installers and publish GitHub Release.
# Tag: v{version}  →  assets: PrysmrSetup.exe, Prysmor-{version}.pkg
name: Build installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Premiere panel semver (matches version.txt)
        required: true
        default: "5.4.7"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - name: Checkout (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download ffmpeg for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "prysmor-panel\panel\ffmpeg\win" | Out-Null
          Write-Host "Downloading ffmpeg for Windows..."
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg-win.zip" -TimeoutSec 120
          Expand-Archive "ffmpeg-win.zip" -DestinationPath "ffmpeg-win-extracted" -Force
          $exe = Get-ChildItem -Path "ffmpeg-win-extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "prysmor-panel\panel\ffmpeg\win\ffmpeg.exe"
          Write-Host "ffmpeg.exe ready: $(Get-Item 'prysmor-panel\panel\ffmpeg\win\ffmpeg.exe' | Select-Object -ExpandProperty Length) bytes"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Compile NSIS installer
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "$env:ProgramFiles\NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) { throw "makensis not found after choco install nsis" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $makensis "prysmor-panel\installer\windows\installer.nsi"
          if (-not (Test-Path "dist\PrysmrSetup.exe")) { throw "dist\PrysmrSetup.exe not produced" }
          Get-Item "dist\PrysmrSetup.exe" | Format-List Name, Length

      - name: Upload windows-installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/PrysmrSetup.exe

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - name: Checkout (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download ffmpeg for macOS
        run: |
          mkdir -p prysmor-panel/panel/ffmpeg/mac
          echo "Downloading ffmpeg for macOS..."
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg-mac.zip --max-time 120
          unzip -o ffmpeg-mac.zip -d ffmpeg-mac-extracted
          cp ffmpeg-mac-extracted/ffmpeg prysmor-panel/panel/ffmpeg/mac/ffmpeg
          chmod +x prysmor-panel/panel/ffmpeg/mac/ffmpeg
          echo "ffmpeg ready: $(du -sh prysmor-panel/panel/ffmpeg/mac/ffmpeg)"

      - name: Build macOS .pkg
        id: macpkg
        run: |
          chmod +x prysmor-panel/installer/build-mac-pkg.sh
          bash prysmor-panel/installer/build-mac-pkg.sh
          PKG=$(ls dist/Prysmor-*.pkg | head -1)
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          ls -lh "$PKG"

      - name: Upload mac-installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: ${{ steps.macpkg.outputs.pkg }}

  release:
    name: release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="5.4.7"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "Premiere panel version: $V (tag: v${V})"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          WIN="assets/windows-installer/PrysmrSetup.exe"
          MAC=$(find assets/mac-installer -name 'Prysmor-*.pkg' | head -1)
          test -f "$WIN"
          test -n "$MAC" && test -f "$MAC"
          REPO="${GITHUB_REPOSITORY}"

          NOTES="## Prysmor for Premiere Pro v${V}

          - Fix timeline clip detection when selection APIs fail (playhead fallback for PP 2024–2026)
          - OTA + fresh installs ship panel **${V}**

          | Platform | File |
          |----------|------|
          | Windows | \`PrysmrSetup.exe\` |
          | macOS | \`Prysmor-${V}.pkg\` |"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$WIN" "$MAC" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"
          else
            gh release create "$TAG" "$WIN" "$MAC" \
              --repo "$REPO" \
              --title "Prysmor Panel ${TAG}" \
              --notes "$NOTES"
          fi

          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          echo "Windows: https://github.com/${OWNER}/${NAME}/releases/download/${TAG}/PrysmrSetup.exe"
          echo "macOS:   https://github.com/${OWNER}/${NAME}/releases/download/${TAG}/Prysmor-${V}.pkg"
